<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理端 - 智能问数系统</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
</head>

<body>
    <div id="loginOverlay" class="login-overlay" style="display:none">
        <div class="overlay-content">
            <div class="overlay-icon">🔒</div>
            <h2>请先登录</h2>
            <p>管理端需要管理员权限</p>
            <a href="/login" class="overlay-btn">前往登录</a>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <nav class="admin-topbar">
            <div class="admin-logo" onclick="window.location.href='/'">
                <span>🎯</span> 问数系统
            </div>
            <div class="admin-tabs" id="adminTabs">
                <button class="admin-tab active" data-module="ontology">本体管理</button>
                <button class="admin-tab" data-module="tables">数据表管理</button>
                <button class="admin-tab" data-module="mapping">映射管理</button>
                <button class="admin-tab" data-module="data">数据管理</button>
                <button class="admin-tab" data-module="dsl">DSL日志</button>
                <button class="admin-tab" data-module="mcp">MCP管理</button>
                <button class="admin-tab" data-module="db">数据库连接</button>
                <button class="admin-tab" data-module="knowledge">知识配置</button>
                <button class="admin-tab" data-module="prompts">提示词配置</button>
                <button class="admin-tab" data-module="users">用户权限</button>
            </div>
            <div class="admin-user">
                <span id="adminUserName"></span>
                <div class="admin-user-avatar">👤</div>
            </div>
        </nav>

        <div class="admin-content" id="adminContent">
            <div class="module-panel active" id="mod-ontology">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">本体管理</div>
                        <div class="panel-subtitle">管理实体、属性和关系</div>
                    </div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="showImportOntologyModal()">⇪ 导入本体Excel</button>
                        <button class="btn btn-primary" onclick="showAddEntityModal()">＋ 新增实体</button>
                        <button class="btn btn-secondary" onclick="showAddRelationModal()">＋ 新增关系</button>
                    </div>
                </div>
                <div class="three-col">
                    <div class="col-scroll">
                        <div class="card-title">实体列表</div>
                        <div id="entityList"></div>
                    </div>
                    <div class="col-scroll">
                        <div class="card-title">实体关系图谱</div>
                        <div id="ontologyGraph"
                            style="height:300px;background:var(--bg-tertiary);border-radius:var(--radius-md);margin-bottom:16px">
                        </div>
                        <div class="card-title">关系列表</div>
                        <div id="relationList"></div>
                    </div>
                    <div class="col-scroll">
                        <div class="card-title">实体详情</div>
                        <div id="entityDetail">
                            <div style="padding:20px;color:var(--text-muted)">→ 点击左侧实体查看详情</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="module-panel" id="mod-tables">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">数据表管理</div>
                        <div class="panel-subtitle">查看当前数据表结构</div>
                    </div>
                </div>
                <div id="tableStructure">
                    <div style="padding:20px;color:var(--text-muted)">数据表结构加载中...</div>
                </div>
            </div>

            <div class="module-panel" id="mod-mapping">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">映射管理</div>
                        <div class="panel-subtitle">配置本体与数据表映射关系</div>
                    </div>
                    <div class="panel-actions">
                        <button class="btn btn-primary" onclick="showAddMappingModal()">＋ 新增映射</button>
                    </div>
                </div>
                <div id="mappingContent">
                    <div id="mappingList"></div>
                </div>
            </div>

            <div class="module-panel" id="mod-data">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">数据管理</div>
                        <div class="panel-subtitle">对表数据进行增删改查</div>
                    </div>
                </div>
                <div style="display:flex;gap:12px;margin-bottom:16px">
                    <div>
                        <label style="font-size:12px;color:var(--text-muted)">实体/表</label>
                        <select class="form-input form-select" id="dataEntitySelect" onchange="loadDataTable()" style="width:180px"></select>
                    </div>
                    <div style="flex:1">
                        <label style="font-size:12px;color:var(--text-muted)">搜索</label>
                        <input class="form-input" id="dataSearch" placeholder="输入关键字搜索..." onkeyup="if(event.key==='Enter')loadDataTable()" style="width:100%">
                    </div>
                    <div style="align-self:flex-end">
                        <button class="btn btn-primary" onclick="showAddDataModal()">＋ 新增</button>
                    </div>
                </div>
                <div id="dataTableContainer"></div>
            </div>

            <div class="module-panel" id="mod-dsl">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">DSL 生成日志</div>
                        <div class="panel-subtitle">查看历史 DSL 生成记录</div>
                    </div>
                    <div class="search-box">
                        <input class="search-input" id="dslSearch" placeholder="搜索问题..." onkeyup="if(event.key==='Enter')loadDSLLogs()">
                        <button class="btn btn-secondary" onclick="loadDSLLogs()">搜索</button>
                    </div>
                </div>
                <div class="dsl-cards" id="dslCards"></div>
            </div>

            <div class="module-panel" id="mod-mcp">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">MCP 管理</div>
                        <div class="panel-subtitle">管理和接入 MCP 服务</div>
                    </div>
                    <button class="btn btn-primary" onclick="showAddMCPModal()">＋ 新增 MCP</button>
                </div>
                <div id="mcpList"></div>
            </div>

            <div class="module-panel" id="mod-db">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">数据库连接配置</div>
                        <div class="panel-subtitle">切换 sheet/mysql 并配置 MySQL 参数</div>
                    </div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="testDBConfigAction()">测试连接</button>
                        <button class="btn btn-primary" onclick="saveDBConfigAction()">保存配置</button>
                    </div>
                </div>
                <div class="card">
                    <div class="form-row">
                        <label>存储模式</label>
                        <select class="form-input form-select" id="dbStoreType">
                            <option value="sheet">sheet (Excel)</option>
                            <option value="mysql">mysql (SQL)</option>
                        </select>
                    </div>
                    <div class="form-row"><label>Host</label><input class="form-input" id="dbHost" placeholder="127.0.0.1"></div>
                    <div class="form-row"><label>Port</label><input class="form-input" id="dbPort" type="number" placeholder="3306"></div>
                    <div class="form-row"><label>User</label><input class="form-input" id="dbUser" placeholder="root"></div>
                    <div class="form-row"><label>Password</label><input class="form-input" id="dbPassword" type="password" placeholder="留空可保持原密码"></div>
                    <div class="form-row"><label>Database</label><input class="form-input" id="dbDatabase" placeholder="your_database"></div>
                    <div class="form-row">
                        <label><input type="checkbox" class="form-checkbox" id="dbKeepPassword" checked> 密码留空时保持原密码</label>
                    </div>
                    <div id="dbConfigHint" style="font-size:12px;color:var(--text-muted)"></div>
                </div>
            </div>

            <div class="module-panel" id="mod-knowledge">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">知识配置</div>
                        <div class="panel-subtitle">管理术语解释、全局同义词和指标SQL规则</div>
                    </div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="showAddSqlRuleModal()">＋ 新增指标SQL规则</button>
                        <button class="btn btn-secondary" onclick="showAddRewriteRuleModal()">＋ 新增同义词转换</button>
                        <button class="btn btn-primary" onclick="showAddKnowledgeModal()">＋ 新增知识</button>
                    </div>
                </div>
                <div id="knowledgeList"></div>
            </div>

            <div class="module-panel" id="mod-prompts">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">提示词配置</div>
                        <div class="panel-subtitle">管理各模型调用场景的提示词模板</div>
                    </div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="loadPromptsModule()">刷新</button>
                    </div>
                </div>
                <div id="promptList"></div>
            </div>

            <div class="module-panel" id="mod-users">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">用户权限管理</div>
                        <div class="panel-subtitle">管理系统用户和权限</div>
                    </div>
                    <button class="btn btn-primary" onclick="showAddUserModal()">＋ 新增用户</button>
                </div>
                <div id="usersTable"></div>
            </div>
        </div>
    </div>

    <div id="modalContainer"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/admin.js"></script>
</body>

</html>
